name: Publish

# Releases go out through PyPI Trusted Publishing, so no API token is stored
# anywhere: GitHub mints a short-lived OIDC token and PyPI exchanges it for a
# one-shot upload credential.  The pending-publisher entry on PyPI must name
# this repository, this workflow file and the `pypi` environment.
#
#   * a published GitHub Release  -> PyPI
#   * a manual run                -> TestPyPI (rehearsal)
#
# Both jobs are gated on the test job, so a red suite stops the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload the distributions built by this run
        type: choice
        options: [testpypi, none]
        default: testpypi

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current stable; the middle versions are
        # covered by the floor/ceiling pair for a package this size.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # `integration` needs a real ffmpeg on PATH and real video, which a
      # release gate should not depend on.
      - run: python -m pytest -m "not integration"

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # twine >= 7 is required to upload core metadata 2.5, which is what the
      # PEP 639 SPDX licence field produces.
      - run: python -m pip install --upgrade build "twine>=7"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-video-frames
    permissions:
      id-token: write # the OIDC token Trusted Publishing exchanges for upload rights
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-video-frames
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: Publish to the MCP Registry
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      id-token: write # the OIDC token the registry exchanges for publish rights
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Ownership of a PyPI package is proven by reading the description of the
      # published release, so the upload has to be visible on PyPI before we
      # claim the name. The upload itself returns before the JSON API serves the
      # new version, hence the wait rather than a bare publish.
      - name: Wait for the release to appear on PyPI
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::no release tag on this run, so the version is unknown"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/mcp-video-frames/${VERSION}/json" > /dev/null; then
              echo "mcp-video-frames ${VERSION} is visible on PyPI"
              exit 0
            fi
            echo "not visible yet (attempt ${attempt}/30), waiting 10s"
            sleep 10
          done
          echo "::error::mcp-video-frames ${VERSION} never became visible on PyPI"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # server.json is the human-maintained template; the tag is authoritative
      # for the version, so the two cannot drift into publishing the wrong one.
      - name: Point server.json at this release
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish the server
        run: ./mcp-publisher publish
